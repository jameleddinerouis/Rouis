<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Client | ROUIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #050505; color: #fafafa; font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Syne', sans-serif; }
        .glass { background: rgba(25, 25, 25, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); }
        .step-active { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); }
        .step-done { opacity: 0.4; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-neutral-900 via-[#050505] to-[#050505]">

    <a href="/" class="absolute top-6 left-6 text-gray-500 hover:text-white transition-colors text-sm font-medium">
        <i class="fa-solid fa-arrow-left"></i> Retour au site
    </a>

    <!-- Login Box -->
    <div id="login-box" class="glass max-w-sm w-full rounded-2xl p-10 text-center hidden">
        <h1 class="font-display text-2xl font-bold text-white mb-2">Espace Client</h1>
        <p class="text-gray-400 text-sm mb-8">Connexion à votre espace de suivi de projet.</p>
        
        <form id="track-form" class="space-y-4">
            <input type="text" id="track-id-input" placeholder="ID Commande" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-center focus:outline-none text-white">
            <button type="submit" class="w-full bg-white text-black font-medium py-3 rounded-lg">Accéder</button>
        </form>
    </div>

    <!-- Dashboard Client -->
    <div id="content" class="glass max-w-xl w-full rounded-2xl p-10 hidden relative">
        <div class="text-center border-b border-white/5 pb-8 mb-8">
            <h1 class="font-display text-[10px] text-gray-500 uppercase tracking-[0.2em] mb-2">Dossier Actif</h1>
            <h2 class="text-3xl font-display font-bold mb-1" id="c-name">Chargement...</h2>
            <p class="text-gray-400 text-sm" id="c-service"></p>
        </div>

        <div class="space-y-4" id="steps-container"></div>

        <div id="demo-box" class="hidden mt-10 pt-8 border-t border-white/5">
            <a id="c-demo-link" href="#" target="_blank" class="block w-full text-center bg-white text-black py-4 rounded-xl font-bold text-sm hover:scale-[1.02] transition-transform">
                Visualiser la Démo du Site
            </a>
        </div>

        <div class="mt-10 text-center">
            <a href="https://wa.me/21695213460" target="_blank" class="inline-flex items-center gap-2 text-xs font-medium text-gray-400 hover:text-white transition-colors">
                <i class="fa-brands fa-whatsapp text-lg"></i> Contacter Rouis Studio
            </a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2TfFM8S6sKtbM_t39YQlEe-um_VlkRI4",
            authDomain: "rouis-b6207.firebaseapp.com",
            projectId: "rouis-b6207",
            storageBucket: "rouis-b6207.firebasestorage.app",
            messagingSenderId: "838016233763",
            appId: "1:838016233763:web:bab963985f737a9bd69c96"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const stepsLabels = ["Stratégie & Brief", "Design UI/UX", "Développement Web", "Phase de Livraison"];

        document.getElementById("track-form").addEventListener("submit", (e) => {
            e.preventDefault();
            window.location.href = `/suivis?id=${document.getElementById("track-id-input").value.trim()}`;
        });

        function initDashboard() {
            const orderId = new URLSearchParams(window.location.search).get("id");
            if (!orderId) {
                document.getElementById("login-box").classList.remove("hidden");
                return;
            }

            // Écoute en temps réel de la progression
            onSnapshot(doc(db, "orders", orderId), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById("content").classList.remove("hidden");
                    document.getElementById("c-name").innerText = data.clientName;
                    document.getElementById("c-service").innerText = data.service;

                    const container = document.getElementById("steps-container");
                    container.innerHTML = ""; // Vider avant de reconstruire
                    
                    stepsLabels.forEach((label, index) => {
                        const stepNum = index + 1;
                        const isDone = stepNum < data.step;
                        const isCurrent = stepNum === data.step;
                        
                        const div = document.createElement('div');
                        div.className = `p-5 rounded-xl flex items-center gap-4 text-sm ${isCurrent ? 'step-active font-medium' : isDone ? 'step-done' : 'opacity-20 border border-white/5'}`;
                        div.innerHTML = `<span class="w-8 h-8 flex items-center justify-center rounded-full bg-white/10 text-xs">${isDone ? '✓' : stepNum}</span> ${label}`;
                        container.appendChild(div);
                    });

                    if (data.previewUrl) {
                        document.getElementById("demo-box").classList.remove("hidden");
                        document.getElementById("c-demo-link").href = data.previewUrl;
                    }
                } else {
                    document.getElementById("content").classList.add("hidden");
                    document.getElementById("login-box").classList.remove("hidden");
                    alert("Identifiant incorrect ou commande introuvable.");
                }
            });
        }

        initDashboard();
    </script>
</body>
</html>
