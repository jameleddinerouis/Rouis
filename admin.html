<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ROUIS | Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #fafafa; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(25, 25, 25, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Login -->
    <div id="login-screen" class="glass p-10 rounded-2xl w-full max-w-sm text-center">
        <h1 class="font-['Syne'] text-2xl font-bold mb-6 tracking-wide">ADMIN.</h1>
        <input type="password" id="admin-pass" placeholder="Code secret" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white mb-4 text-center font-mono focus:outline-none">
        <button onclick="checkAuth()" class="w-full bg-white text-black font-bold py-3 rounded-lg">Accéder</button>
    </div>

    <!-- Dashboard Principal -->
    <div id="admin-panel" class="hidden glass p-10 rounded-2xl w-full max-w-lg">
        <h2 class="text-xs uppercase tracking-widest text-gray-500 font-bold mb-6 text-center">Gestion de Projet</h2>
        
        <form id="load-form" class="flex gap-2 mb-8 border-b border-white/5 pb-8">
            <input type="text" id="order-id" placeholder="ID (ex: CMD-123)" required class="flex-1 bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-white/30 text-white">
            <button type="submit" class="bg-white/10 hover:bg-white/20 px-6 py-3 rounded-lg text-sm transition-colors font-medium">Charger</button>
        </form>

        <form id="update-form" class="space-y-4 opacity-50 pointer-events-none transition-opacity">
            <div>
                <label class="block text-[10px] uppercase text-gray-500 mb-1 pl-1">Nom du Client</label>
                <input type="text" id="client-name" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-sm focus:outline-none text-white">
            </div>
            <div>
                <label class="block text-[10px] uppercase text-gray-500 mb-1 pl-1">Prestation (Ex: L'Essentiel)</label>
                <input type="text" id="service-name" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-sm focus:outline-none text-white">
            </div>
            <div>
                <label class="block text-[10px] uppercase text-gray-500 mb-1 pl-1">Étape actuelle</label>
                <select id="step" class="w-full bg-[#111] border border-white/10 rounded-lg px-4 py-3 text-sm focus:outline-none text-white">
                    <option value="1">1. Stratégie & Brief</option>
                    <option value="2">2. Design UI/UX</option>
                    <option value="3">3. Développement Web</option>
                    <option value="4">4. Phase de Livraison</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] uppercase text-gray-500 mb-1 pl-1">Lien de la Démo (Optionnel)</label>
                <input type="url" id="preview-url" placeholder="https://" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-sm focus:outline-none text-white">
            </div>
            
            <button type="submit" class="w-full bg-white text-black font-bold py-4 rounded-lg mt-4 hover:bg-gray-200 transition-colors">
                Enregistrer la commande
            </button>
        </form>

        <div id="link-box" class="mt-6 hidden p-4 bg-white/5 border border-white/10 rounded-lg text-center">
            <p class="text-xs text-gray-400 mb-2">Lien à envoyer au client :</p>
            <button onclick="copyLink()" id="copy-btn" class="w-full bg-white/10 hover:bg-white/20 py-2 rounded text-sm font-mono border border-white/5 transition-colors">
                Copier le lien
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2TfFM8S6sKtbM_t39YQlEe-um_VlkRI4",
            authDomain: "rouis-b6207.firebaseapp.com",
            projectId: "rouis-b6207",
            storageBucket: "rouis-b6207.firebasestorage.app",
            messagingSenderId: "838016233763",
            appId: "1:838016233763:web:bab963985f737a9bd69c96"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let currentOrderId = null;

        window.checkAuth = () => {
            if (document.getElementById("admin-pass").value === "270511") {
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("admin-panel").classList.remove("hidden");
            }
        };

        document.getElementById("load-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const id = document.getElementById("order-id").value.trim();
            currentOrderId = id;
            
            const docRef = doc(db, "orders", id);
            const docSnap = await getDoc(docRef);

            const form = document.getElementById("update-form");
            form.classList.remove("opacity-50", "pointer-events-none");
            document.getElementById("link-box").classList.remove("hidden");
            
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById("client-name").value = data.clientName;
                document.getElementById("service-name").value = data.service;
                document.getElementById("step").value = data.step;
                document.getElementById("preview-url").value = data.previewUrl || "";
            } else {
                form.reset();
            }
        });

        document.getElementById("update-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const data = {
                clientName: document.getElementById("client-name").value,
                service: document.getElementById("service-name").value,
                step: parseInt(document.getElementById("step").value),
                previewUrl: document.getElementById("preview-url").value,
                updatedAt: new Date().toISOString()
            };
            await setDoc(doc(db, "orders", currentOrderId), data);
            
            const btn = document.querySelector("#update-form button[type='submit']");
            btn.innerText = "✓ Sauvegardé";
            btn.classList.add("bg-green-500", "text-white");
            setTimeout(() => {
                btn.innerText = "Enregistrer la commande";
                btn.classList.remove("bg-green-500", "text-white");
            }, 2000);
        });

        window.copyLink = () => {
            const url = `${window.location.origin}/suivis?id=${currentOrderId}`;
            navigator.clipboard.writeText(url).then(() => {
                const btn = document.getElementById("copy-btn");
                btn.innerText = "✓ Lien copié !";
                btn.classList.add("bg-green-500/20", "text-green-400");
                setTimeout(() => {
                    btn.innerText = "Copier le lien";
                    btn.classList.remove("bg-green-500/20", "text-green-400");
                }, 2000);
            });
        };
    </script>
</body>
</html>
